spring.application.name=car-wash-management

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

washmate.security.jwt.secret=${JWT_SECRET}
washmate.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:60}
washmate.security.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
washmate.security.otp.mock-code=${OTP_MOCK_CODE:}
washmate.security.otp.expose-mock-code=${OTP_EXPOSE_MOCK_CODE:false}
washmate.security.otp.ttl-minutes=${OTP_TTL_MINUTES:5}
washmate.security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
washmate.security.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
washmate.security.otp.sender=${OTP_SENDER:log}
washmate.security.otp.mail.from=${OTP_MAIL_FROM:no-reply@washmate.local}
washmate.security.otp.mail.subject=${OTP_MAIL_SUBJECT:Your WashMate OTP code}
washmate.security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
washmate.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}
washmate.security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
washmate.security.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
washmate.security.docs-enabled=${DOCS_ENABLED:false}
springdoc.api-docs.enabled=${DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${DOCS_ENABLED:false}
washmate.upload.avatar-dir=${AVATAR_UPLOAD_DIR:uploads/avatars}
washmate.supabase.url=${SUPABASE_URL:}
washmate.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
washmate.supabase.storage.avatar-bucket=${SUPABASE_AVATAR_BUCKET:avatars}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

washmate.payment.vnpay.enabled=${VNPAY_ENABLED:true}
washmate.payment.vnpay.tmn-code=${VNPAY_TMN_CODE}
washmate.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET}
washmate.payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
washmate.payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
washmate.payment.vnpay.frontend-result-url=${VNPAY_FRONTEND_RESULT_URL:http://localhost:3000/payment/vnpay-return}
washmate.payment.vnpay.timeout-minutes=${VNPAY_TIMEOUT_MINUTES:15}
# Fallback settle qua return URL - CHI bat khi test local (mac dinh tat o production)
washmate.payment.vnpay.return-fallback-enabled=${VNPAY_RETURN_FALLBACK_ENABLED:false}

# Tu dong huy don CASH PENDING sau khi khung gio da qua (giai phong slot).
# scan-ms: chu ky quet; grace-minutes: an han sau gio ket thuc slot moi huy.
washmate.booking.cash-timeout.scan-ms=${CASH_TIMEOUT_SCAN_MS:300000}
washmate.booking.cash-timeout.grace-minutes=${CASH_TIMEOUT_GRACE_MINUTES:30}

# Tu dong danh dau NO_SHOW cho don CONFIRMED chua check-in sau GIO HEN + grace-minutes.
# Vd slot 16:00, grace 15 -> 16:15 chua check-in thi huy va giai phong slot.
# Khong co co che nay thi don ket o CONFIRMED va chiem capacity slot vinh vien.
washmate.booking.no-show.scan-ms=${NO_SHOW_SCAN_MS:60000}
washmate.booking.no-show.grace-minutes=${NO_SHOW_GRACE_MINUTES:15}

# Chi quet nguoc toi da bay nhieu ngay. BAT BUOC phai co gioi han duoi: khong co no,
# scheduler se danh NO_SHOW cho MOI don CONFIRMED ton dong tu truoc -> khach nhan thong bao
# "vang mat" cho don tu hang thang truoc va an an tich du de bi KHOA QUYEN DAT LICH.
# Quet moi phut nen 2 ngay la thua suc bat moi don lo hen that.
washmate.booking.no-show.lookback-days=${NO_SHOW_LOOKBACK_DAYS:2}

# An tich vang mat: vang mat du so lan nay trong cua so block-window-days thi bi CAM DAT LICH.
# Chan kieu pha hoai kien tri ma tran don treo khong bat duoc (dat -> de troi gio -> dat lai).
# An tu het han khi troi ra ngoai cua so; staff go som bang POST /api/bookings/{id}/excuse-no-show.
# max-before-block = 0 de tat co che.
washmate.booking.no-show.max-before-block=${NO_SHOW_MAX_BEFORE_BLOCK:2}
washmate.booking.no-show.block-window-days=${NO_SHOW_BLOCK_WINDOW_DAYS:90}

# Cua so dat truoc toi da (ngay). Hang thanh vien cao co the duoc nhieu hon (MembershipTier).
washmate.booking.max-advance-days=${BOOKING_MAX_ADVANCE_DAYS:30}

# Phai dat truoc gio hen it nhat bay nhieu phut (chan dat sat gio).
# Dung CHUNG boi BookingService (validate) va BookingSlotServiceImpl (loc slot hien thi)
# -> doi mot cho la ca hai cung doi, danh sach khong lech voi kha nang dat that.
washmate.booking.min-lead-minutes=${BOOKING_MIN_LEAD_MINUTES:30}

# Staff duoc check-in som toi da bay nhieu phut truoc gio hen (va khong duoc sau khi het slot).
washmate.booking.check-in.early-minutes=${BOOKING_CHECK_IN_EARLY_MINUTES:30}

# Khach phai tu huy truoc gio hen it nhat bay nhieu phut. 0 = chi can truoc gio hen.
# Staff/owner khong bi chan (xu ly ngoai le tai quay).
washmate.booking.cancel-cutoff-minutes=${BOOKING_CANCEL_CUTOFF_MINUTES:0}

# Chong pha hoai (rai don giu kin garage ma khong tra tien), hai tang:
#  - max-open-per-customer: tran so don CHUA THANH TOAN dang mo cua mot khach.
#    Khach that tra tien xong thi khong bao gio cham tran.
#  - max-open-per-garage-per-day: chan don het han muc vao dung mot garage / mot ngay.
# 0 = tat tung tang.
washmate.booking.max-open-per-customer=${BOOKING_MAX_OPEN_PER_CUSTOMER:5}
washmate.booking.max-open-per-garage-per-day=${BOOKING_MAX_OPEN_PER_GARAGE_PER_DAY:2}

# Ti le capacity moi slot duoc phep bi don CASH chua thanh toan giu cho (0..1).
# Day la lop DUY NHAT khong tinh theo tai khoan -> lop duy nhat chan duoc kieu tao hang loat
# tai khoan rac. Muon vuot qua no thi buoc phai thanh toan online that.
# Ngoai khoang (0,1) = tat.
washmate.booking.cash-share-per-slot=${BOOKING_CASH_SHARE_PER_SLOT:0.5}

# Tai khoan chua tung hoan tat don nao (ke pha luon dung tai khoan moi) bi siet rieng.
# 0 = tat tung muc.
washmate.booking.new-account.max-open=${BOOKING_NEW_ACCOUNT_MAX_OPEN:1}
washmate.booking.new-account.max-advance-days=${BOOKING_NEW_ACCOUNT_MAX_ADVANCE_DAYS:2}

# Rate limit theo IP cho auth endpoints (login/otp/forgot password)
washmate.security.ratelimit.enabled=${AUTH_RATELIMIT_ENABLED:true}
washmate.security.ratelimit.max-requests=${AUTH_RATELIMIT_MAX_REQUESTS:10}
washmate.security.ratelimit.window-seconds=${AUTH_RATELIMIT_WINDOW_SECONDS:60}

# ===============================
# Mail - SMTP
# ===============================
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ===============================
# App Mail Config
# ===============================
app.mail.from=${APP_MAIL_FROM:WashMate <no-reply@autowash.io.vn>}

# ===============================
# Gemini AI Config
# ===============================
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.prompt.version=${GEMINI_PROMPT_VERSION:v1}
# temperature 0 = on dinh (cung prompt ra cung ket qua); thinking-budget 0 = tat thinking cho nhanh
gemini.temperature=${GEMINI_TEMPERATURE:0.0}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:2048}
gemini.thinking-budget=${GEMINI_THINKING_BUDGET:0}
# true = log email chien dich thay vi gui that (test full flow khong can SMTP/Resend key)
washmate.campaign.mail.mock=${CAMPAIGN_MAIL_MOCK:false}
# Cooldown giua 2 lan regenerate AI enrichment cho cung 1 insight (chong spam quota)
washmate.insight.ai.regenerate-cooldown-seconds=${AI_REGENERATE_COOLDOWN_SECONDS:60}
